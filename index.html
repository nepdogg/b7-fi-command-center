<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B7 FI Command Center v0.4</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-theme="countdown">
  <header class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="eyebrow">FINAL INTEGRATION OPERATIONS · BUILDING 7</div>
      <h1>B7 FI COMMAND CENTER</h1>
      <p>Quarter planning, FI execution, priorities, shipping coordination, and automatically generated operational status.</p>
    </div>
  </header>

  <nav class="main-nav" aria-label="Main navigation">
    <button data-view="countdown" class="nav-btn active">Tool Countdown</button>
    <button data-view="shipping" class="nav-btn">Shipping Schedule</button>
    <button data-view="daily" class="nav-btn">Weekday Priorities</button>
    <button data-view="meeting" class="nav-btn">Morning Status</button>
    <button data-view="weekend" class="nav-btn">Weekend Priorities</button>
    <button data-view="systems" class="nav-btn">Tools</button>
    <button data-view="admin" class="nav-btn admin-nav">Administration</button>
  </nav>

  <div id="pageIdentity" class="page-identity"></div>
  <main id="app" class="page-shell"></main>
  <div id="floatingActions" class="floating-actions" aria-label="Quick actions"></div>

  <footer>
    <strong>B7 FI Command Center v0.4</strong>
    <span>Working visualization prototype · fictional sample data · browser-local storage</span>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
