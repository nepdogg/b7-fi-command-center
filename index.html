<!DOCTYPE html>

<body data-theme="home">
<div class="sticky-header"><header class="hero compact-hero v57-hero">
  <div class="v57-header">
    <section class="v57-header-left">B7 FI COMMAND CENTER</section>
    <section class="v57-header-center"><img class="v57-kla-logo" src="assets/kla-plus-official.png" alt="KLA+"></section>

<nav class="main-nav" aria-label="Main navigation">
